<meta name="theme-color" content="#3d9a4f">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f8f3;--card:#fff;--ink:#1f2a37;--sub:#667085;--line:#e1e6da;--green:#3d9a4f;--greenD:#2c7a3b;--tint:#e6f4e8;--sun:#ffc93c;--red:#c9453f;--onG:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151a17;--card:#1f2622;--ink:#eef2ec;--sub:#9aa79d;--line:#2f3933;--green:#58b86a;--greenD:#7ccf8b;--tint:#22352a;--red:#ef7a74;--onG:#0f1a12}}
:root[data-theme="dark"]{--bg:#151a17;--card:#1f2622;--ink:#eef2ec;--sub:#9aa79d;--line:#2f3933;--green:#58b86a;--greenD:#7ccf8b;--tint:#22352a;--red:#ef7a74;--onG:#0f1a12}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif}
#app{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1{font:400 30px/1.2 Jua,"Noto Sans KR",sans-serif;margin:8px 0 4px}
.sub{color:var(--sub);margin:0 0 16px}
input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:11px 13px}
input:focus,textarea:focus,button:focus-visible,summary:focus-visible{outline:3px solid var(--sun);outline-offset:1px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.row input{flex:1 1 200px;width:auto;min-width:0}
.add{display:grid;gap:8px;margin:12px 0}
.btn{font:700 15px "Noto Sans KR",sans-serif;background:var(--green);color:var(--onG);border:0;border-bottom:4px solid var(--greenD);border-radius:12px;padding:10px 18px;cursor:pointer}
.btn:active{transform:translateY(2px);border-bottom-width:2px}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-bottom-width:3px}

<div id="sheet"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const DLX='<button class="dlx" data-act="dlgno" aria-label="닫기">×</button>';
const APP_ICON=(document.querySelector('link[rel="icon"]')||{}).href||'';
try{const at=document.querySelector('link[rel="apple-touch-icon"]');if(at)at.href=APP_ICON}catch(e){}
function guessLocale(name){
  const n=(name||'');
  const map=[
    [/한국|korean/i,'ko-KR'],
    [/일본|japan/i,'ja-JP'],
    [/중국|한자|chinese|mandarin/i,'zh-CN'],
    [/스페인|spanish/i,'es-ES'],
    [/프랑스|french/i,'fr-FR'],
    [/독일|german/i,'de-DE'],
    [/베트남|vietnam/i,'vi-VN'],
    [/태국|thai/i,'th-TH'],
    [/러시아|russian/i,'ru-RU'],
    [/이탈리아|italian/i,'it-IT'],
    [/포르투갈|portuguese/i,'pt-PT'],
    [/영어|english/i,'en-US']
  ];
  for(const [re,loc] of map) if(re.test(n)) return loc;
  return 'en-US';
}
function flagFor(locale){
  const cc=(locale||'').split('-')[1]||'';
  const map={US:'🇺🇸',JP:'🇯🇵',CN:'🇨🇳',KR:'🇰🇷',ES:'🇪🇸',FR:'🇫🇷',DE:'🇩🇪',VN:'🇻🇳',TH:'🇹🇭',RU:'🇷🇺',IT:'🇮🇹',PT:'🇵🇹'};
  return map[cc]||'';
}
function withFlag(name,locale){
  const stripped=(name||'').replace(/^[\u{1F1E6}-\u{1F1FF}]{2}\s*/u,'');
  const f=flagFor(locale);
  return f?f+' '+stripped:stripped;
}
let S={sections:[],tabs:[]};
function ensureTabs(){
  if(!Array.isArray(S.tabs)||!S.tabs.length){
    S.tabs=[{id:'en',name:withFlag('영어','en-US'),pron:'ipa',locale:'en-US',audio:true},{id:'ja',name:withFlag('일본어','ja-JP'),pron:'roman',locale:'ja-JP',audio:true}];
  }else{
    S.tabs=S.tabs.map(t=>Object.assign({},t,{name:withFlag(t.name,t.locale||'en-US')}));
  }
}
try{const r=localStorage.getItem('vocab-v1');if(r)S=JSON.parse(r)}catch(e){}
ensureTabs();
try{
  if(!localStorage.getItem('vocab-settingsReset-1')){
    ['vocab-tts','vocab-theme','vocab-rep','vocab-start'].forEach(k=>localStorage.removeItem(k));
    localStorage.setItem('vocab-settingsReset-1','1');
  }
}catch(e){}
let FAVC={};
try{FAVC=JSON.parse(localStorage.getItem('vocab-favcolor')||'{}')||{}}catch(e){FAVC={}}
try{(S.tabs||[]).forEach(t=>{if(t.favColor&&!FAVC[t.id])FAVC[t.id]=t.favColor});localStorage.setItem('vocab-favcolor',JSON.stringify(FAVC))}catch(e){}
function getFavColor(id){
  if(FAVC[id])return FAVC[id];
  const t=(S.tabs||[]).find(x=>x.id===id);
  return (t&&t.favColor)||'';
}
function setFavColor(id,c){
  if(c)FAVC[id]=c;else delete FAVC[id];
  try{localStorage.setItem('vocab-favcolor',JSON.stringify(FAVC))}catch(e){}
  S.tabs=(S.tabs||[]).map(t=>{
    if(t.id!==id)return t;
    const n=Object.assign({},t);
    if(c)n.favColor=c;else delete n.favColor;
    return n;
  });
}
let THEME='light';
try{THEME=localStorage.getItem('vocab-theme')||'light'}catch(e){}
function applyTheme(){try{if(THEME==='light'||THEME==='dark')document.documentElement.setAttribute('data-theme',THEME);else document.documentElement.removeAttribute('data-theme')}catch(e){}}
applyTheme();
function isDarkNow(){
  if(THEME==='dark')return true;
  if(THEME==='light')return false;
  try{return matchMedia('(prefers-color-scheme: dark)').matches}catch(e){return false}
}
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{applyBg();if(THEME==='system')render()})}catch(e){}
let BGCOLOR='';
try{BGCOLOR=localStorage.getItem('vocab-bgcolor')||''}catch(e){}
let BGINT=60;
try{BGINT=Number(localStorage.getItem('vocab-bgint'))||60}catch(e){}
const BGINT_STEPS=[[10,0,'연하게'],[30,10,'보통'],[60,20,'진하게']];
function parseColor(c){
  c=(c||'').trim();
  if(c[0]==='#'){
    let h=c.slice(1);
    if(h.length===3)h=h.split('').map(x=>x+x).join('');
    return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];
  }
  const m=c.match(/rgba?\(([^)]+)\)/);
  if(m)return m[1].split(',').slice(0,3).map(n=>parseInt(n.trim(),10));
  return [255,255,255];
}
function mixColor(c1,pct,c2){
  const [r1,g1,b1]=parseColor(c1),[r2,g2,b2]=parseColor(c2||'#ffffff'),t=pct/100;
  const r=Math.round(r1*t+r2*(1-t)),g=Math.round(g1*t+g2*(1-t)),b=Math.round(b1*t+b2*(1-t));
  return `rgb(${r}, ${g}, ${b})`;
}
function applyBg(){
  try{
    const root=document.documentElement;
    if(BGCOLOR&&!isDarkNow()){
      const step=BGINT_STEPS.find(x=>x[0]===BGINT);
      const cardPct=step?step[1]:Math.round(BGINT*0.3);
      root.style.setProperty('--bg',mixColor(BGCOLOR,BGINT,'#ffffff'));
      root.style.setProperty('--card',mixColor(BGCOLOR,cardPct,'#ffffff'));
    }else{
      root.style.removeProperty('--bg');
      root.style.removeProperty('--card');
    }
  }catch(e){}
}
applyBg();
const PASTELS=['#ffd6d6','#ffe4c2','#fff3b0','#e2f3c9','#c9ecd9','#c7ecee','#cfe0ff','#dcd0ff','#f6d1e6'];
let ref=null,timer=null,busy=false,again=false,first=true,ver=0,sent=0,lastLocal=0,lastId='',startLast='';
try{lastId=localStorage.getItem('vocab-last')||''}catch(e){}
let start={mode:'last',sec:''};
try{Object.assign(start,JSON.parse(localStorage.getItem('vocab-start')||'{}'))}catch(e){}
function targetId(last){
  if(start.mode==='home')return '';
  if(start.mode==='sec')return S.sections.some(x=>x.id===start.sec)?start.sec:'';
  return S.sections.some(x=>x.id===last)?last:'';
}
const APP_VERSION='Ver.32';
const stat=m=>{const e=$('#stat');if(e)e.textContent=m};
async function flush(){
  if(!ref)return;
  if(busy){again=true;return}
  busy=true;stat('저장 중…');
  const my=ver;
  const tabsOut=(S.tabs||[]).map(t=>{const c=FAVC[t.id]||t.favColor;return c?Object.assign({},t,{favColor:c}):Object.assign({},t)});
  try{await ref.set({sections:S.sections,tab,tabs:tabsOut,last:lastId,start,rep,tts:TTS,title:S.title||'',theme:THEME,bgColor:BGCOLOR});sent=my;stat('저장됨 ✓')}
  catch(e){stat('서버 저장 실패 · 이 기기에는 저장됨')}
  busy=false;
  if(again){again=false;flush()}
}
const save=()=>{
  ensureTabs();
  try{localStorage.setItem('vocab-v1',JSON.stringify(S))}catch(e){}
  if(ref){ver++;lastLocal=Date.now();clearTimeout(timer);timer=setTimeout(flush,500)}
};
const saveNow=()=>{save();if(ref){clearTimeout(timer);flush()}};
function onDoc(snap){
  if(snap.metadata.hasPendingWrites)return;
  if(!first&&(busy||ver!==sent||Date.now()-lastLocal<4000))return;
  const d=snap.exists?snap.data():null;
  if(d&&Array.isArray(d.sections)){
    let incoming=d.sections;
    if(first){
      incoming=incoming.map(cs=>{
        const localSec=S.sections.find(x=>x.id===cs.id);
        if(!localSec)return cs;
        const mergedWords=(cs.words||[]).map(w=>{
          const lw=(localSec.words||[]).find(x=>x.id===w.id);
          if(!lw)return w;
          const out={...w};
          if(lw.star&&!w.star)out.star=lw.star;
          if(lw.known&&!w.known)out.known=lw.known;
          return out;
        });
        const out={...cs,words:mergedWords};
        if(localSec.color&&!cs.color)out.color=localSec.color;
        return out;
      });
    }
    if(JSON.stringify(incoming)!==JSON.stringify(S.sections)){
      S.sections=JSON.parse(JSON.stringify(incoming));
      try{localStorage.setItem('vocab-v1',JSON.stringify(S))}catch(e){}
      if(view.id&&!sec()){view={name:'home'};study=null}
      const a=document.activeElement;
      if(!(a&&/INPUT|TEXTAREA/.test(a.tagName)))render();
    }
    stat('저장됨 ✓');
  }else if(first&&S.sections.length){flush()}
  else stat('저장 준비 완료 ✓');
  if(first&&d&&Array.isArray(d.tabs)&&d.tabs.length&&d.tabs.every(x=>x&&typeof x.id==='string'&&typeof x.name==='string')){
    S.tabs=d.tabs.map(t=>{
      const localFav=FAVC[t.id]||((S.tabs.find(x=>x.id===t.id)||{}).favColor);
      const keep=localFav||t.favColor;
      return keep?{...t,favColor:keep}:t;
    });
    let changed=false;
    S.tabs.forEach(t=>{if(t.favColor&&FAVC[t.id]!==t.favColor){FAVC[t.id]=t.favColor;changed=true}});
    if(changed){try{localStorage.setItem('vocab-favcolor',JSON.stringify(FAVC))}catch(e){}}
    try{localStorage.setItem('vocab-v1',JSON.stringify(S))}catch(e){}
  }
  if(first&&d&&typeof d.tab==='string'&&S.tabs.some(x=>x.id===d.tab)&&d.tab!==tab){
    tab=d.tab;try{localStorage.setItem('vocab-tab',tab)}catch(e){}
    const a=document.activeElement;
    if(view.name==='home'&&!(a&&/INPUT|TEXTAREA/.test(a.tagName)))render();
  }
  if(first&&d&&d.start&&typeof d.start.mode==='string'){
    start={mode:d.start.mode,sec:d.start.sec||''};
    try{localStorage.setItem('vocab-start',JSON.stringify(start))}catch(e){}
  }
  if(first&&d&&d.tts&&typeof d.tts==='object'){
    TTS=Object.assign({},d.tts);
    TTS.rate=[.7,.9,1.1].includes(d.tts.rate)?d.tts.rate:.9;
    TTS.gap=[1,1.5].includes(d.tts.gap)?d.tts.gap:1;
    try{localStorage.setItem('vocab-tts',JSON.stringify(TTS))}catch(e){}
  }
  if(first&&d&&typeof d.title==='string'&&d.title!==(S.title||'')){
    S.title=d.title;
    try{localStorage.setItem('vocab-v1',JSON.stringify(S))}catch(e){}
    const a=document.activeElement;
    if(view.name==='home'&&!(a&&/INPUT|TEXTAREA/.test(a.tagName)))render();
  }
  if(first&&d&&typeof d.theme==='string'&&['light','dark','system'].includes(d.theme)&&d.theme!==THEME){
    THEME=d.theme;
    try{localStorage.setItem('vocab-theme',THEME)}catch(e){}
    applyTheme();applyBg();
    const a=document.activeElement;
    if(!(a&&/INPUT|TEXTAREA/.test(a.tagName))){if(dlg&&dlg.k==='cfg')openCfg();else if(dlg&&dlg.k==='tabs')openTabs();else render();}
  }
  if(first&&d&&typeof d.bgColor==='string'&&d.bgColor!==BGCOLOR){
    BGCOLOR=d.bgColor;
    try{localStorage.setItem('vocab-bgcolor',BGCOLOR)}catch(e){}
    applyBg();
    const a=document.activeElement;
    if(!(a&&/INPUT|TEXTAREA/.test(a.tagName))&&dlg&&dlg.k==='cfg')openCfg();
  }
  if(first&&d&&[0,1,3].includes(d.rep)&&d.rep!==rep){
    rep=d.rep;try{localStorage.setItem('vocab-rep',String(rep))}catch(e){}
    const a=document.activeElement;
    if(view.name==='sec'&&!(a&&/INPUT|TEXTAREA/.test(a.tagName)))render();
  }
  if(first&&d&&lastId===startLast){
    const tid=targetId(typeof d.last==='string'?d.last:lastId);
    const a=document.activeElement;
    if(tid!==lastId&&!(a&&/INPUT|TEXTAREA/.test(a.tagName))){
      if(tid===''){view={name:'home'};study=null}
      else{const x=S.sections.find(y=>y.id===tid);view={name:'sec',id:tid};study=null;tab=x.lang||'en'}
      render();
    }
  }
  first=false;
}
(async()=>{
  stat('불러오는 중…');
  try{
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    const uid=user?await user.id():null;
    if(!db||!uid){stat(APP_VERSION);return}
    ref=db.doc('data/users/'+uid+'/vocab');
    ref.onSnapshot(onDoc,()=>stat('동기화 오류 · 이 기기에는 저장됨'));
  }catch(e){stat(APP_VERSION)}
})();
let view={name:'home'},study=null;

function speak(t,l){try{const u=new SpeechSynthesisUtterance(t);curUtt=u;useVoice(u,l);const busy=speechSynthesis.speaking||speechSynthesis.pending;if(speechSynthesis.paused)speechSynthesis.resume();if(busy){speechSynthesis.cancel();setTimeout(()=>speechSynthesis.speak(u),80)}else speechSynthesis.speak(u)}catch(e){}}
const sec=()=>S.sections.find(x=>x.id===view.id);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

function tabInfo(id){const t0=(S.tabs||[]).find(x=>x.id===id);return t0?Object.assign({audio:true},t0):{id,name:id,pron:'free',locale:'en-US',audio:true};}
function tabAudio(id){return tabInfo(id).audio!==false;}
function tabName(id){return tabInfo(id).name;}
function tabLocale(id){return tabInfo(id).locale||'en-US';}
function pronLabel(id){const p=tabInfo(id).pron;return p==='ipa'?'발음 (IPA 발음기호)':p==='pinyin'?'발음 (병음 · 한글)':p==='roman'?'발음 (로마자 표기)':'발음';}
function getTitle(){return (S.title&&S.title.trim())||'나만의 단어장';}
let tab=(S.tabs[0]||{id:'en'}).id;
try{const x=localStorage.getItem('vocab-tab');if(S.tabs.some(t=>t.id===x))tab=x}catch(e){}
function home(){
  const lang=s=>s.lang||'en';
  const favN=S.sections.filter(s=>lang(s)===tab).reduce((n,s)=>n+s.words.filter(w=>w.star).length,0);
  const favColor=getFavColor(tab);
  const favTint=(favColor&&!isDarkNow())?` style="background:${favColor};color:#1f2a37;--sub:#667085"`:'';
  const favCard=`<div class="sec fav"${favTint}><button class="secBody" data-act="openfav"><span class="sn">⭐ 즐겨찾기</span><span class="cnt">${favN}개 단어</span></button></div>`;
  const secList=S.sections.filter(s=>lang(s)===tab);
  const reordering=!!view.reorderSec;
  const cards=secList.map((s,i)=>{const n=s.words.length,k=s.words.filter(w=>w.known).length;
    const tint=(s.color&&!isDarkNow())?` style="background:${s.color};color:#1f2a37;--sub:#667085"`:'';
    const trail=reordering
      ?`<div class="secreorder"><button class="ic sm" data-act="secup" data-sec="${s.id}" ${i===0?'disabled':''} aria-label="‘${esc(s.name)}’ 위로">▲</button><button class="ic sm" data-act="secdown" data-sec="${s.id}" ${i===secList.length-1?'disabled':''} aria-label="‘${esc(s.name)}’ 아래로">▼</button></div>`
      :`<button class="secx" data-act="dels" data-sec="${s.id}" aria-label="‘${esc(s.name)}’ 섹션 삭제"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16"/><path d="M6 7l1 13a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-13"/><path d="M9 7V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v3"/></svg></button>`;
    return `<div class="sec"${tint}><button class="secBody" data-act="open" data-id="${s.id}"><span class="sn">${esc(s.name)}</span><span class="cnt">${k} / ${n} 외움</span><span class="bar"><i style="width:${n?k/n*100:0}%"></i></span></button>${trail}</div>`}).join('');
  const reorderBar=secList.length>1?`<div style="display:flex;justify-content:flex-end;margin:6px 0"><button class="btn ghost sm" data-act="reordersec">${reordering?'완료':'↕ 순서 변경'}</button></div>`:'';
  const tabs=S.tabs.map(t0=>`<button role="tab" aria-selected="${tab===t0.id}" class="tab${tab===t0.id?' on':''}" data-act="tab" data-l="${t0.id}">${esc(t0.name)}<small>${S.sections.filter(s=>lang(s)===t0.id).length}</small></button>`).join('')+`<button class="tab add" data-act="tabsopen" aria-label="탭 추가">＋</button>`;
  const form=(view.adding||!cards)
    ?`<form class="row" data-form="addsec"><input name="n" placeholder="${tabName(tab)} 섹션 이름 (예: 섹션 1 · 기초)" required><button class="btn">추가</button>${cards?'<button type="button" class="btn ghost" data-act="cancelnew">취소</button>':''}</form>`
    :`<button class="addcard" data-act="newsec">＋ 새 섹션</button>`;
  const titleHead=view.titleEdit
    ?`<form class="row" data-form="renametitle"><input name="n" value="${esc(getTitle())}" maxlength="30" required><button class="btn">저장</button></form>`
    :`<div class="sh"><span style="display:flex;align-items:center;gap:8px;min-width:0"><button class="logohit" data-act="edittitle" aria-label="단어장 이름 변경"><img src="${APP_ICON}" alt="" style="height:36px;width:auto"></button><h1 style="margin:0">${esc(getTitle())}</h1></span><button class="ic" data-act="opensearch" aria-label="단어 검색" style="width:44px;height:44px;font-size:20px">🔍</button></div>`;
  return `${titleHead}
  <div class="tabs" role="tablist">${tabs}</div>
  ${cards?favCard:''}
  ${cards?reorderBar:''}
  ${cards||`<p class="empty">${tabName(tab)} 섹션이 아직 없어요.</p>`}${reordering?'':form}`;
}

let dlg=null;
function askDel(d,msg,sub,ok){
  dlg=d;
  $('#dlg').innerHTML=`<div class="ov"><div class="dl" role="alertdialog" aria-modal="true" aria-labelledby="dlm">${DLX}<p id="dlm" class="dm">${msg}</p><p class="ds">${sub}</p><div class="dr"><button class="btn ghost" id="dlno" data-act="dlgno">취소</button><button class="btn warn" data-act="dlgok">${ok||'삭제'}</button></div></div></div>`;
  const n=$('#dlno');if(n)n.focus();
}
function closeDlg(){
  if(dlg&&dlg.k==='tabs'){view.edittab=null;view.addtab=false;}
  dlg=null;$('#dlg').innerHTML=''
}
$('#dlg').addEventListener('click',e=>{});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(dlg&&dlg.k!=='cfg'&&dlg.k!=='tabs')closeDlg();else if(!dlg&&sheet)closeSheet()}});

function parseLine(l){
  l=l.trim();if(!l||l[0]==='#')return null;
  let e='';const i=l.indexOf(' | ');if(i>0){e=l.slice(i+3).trim();l=l.slice(0,i).trim()}
  const p=l.split(/\t|\s*[,，、]\s*/);
  if(p.length>=3&&/[a-zA-Z]/.test(p[1]))return{w:p[0].trim(),r:p[1].trim(),m:p.slice(2).join(', ').trim(),e};
  const m=l.match(/^(.+?)(?:\t|\s[-–]\s|\s*[,=]\s*)(.+)$/);
  return m?{w:m[1].trim(),r:'',m:m[2].trim(),e}:null;
}
function listText(s){
  const rows=s.words.map(w=>{
    const c=w.r?[w.w,w.r,w.m]:((/,/.test(w.m)||!/[가-힣]/.test(w.m))?[w.w,'',w.m]:[w.w,w.m]);
    return c.join(', ')+(w.e?' | '+w.e:'');
  });
  return ['# 단어, 발음, 뜻 | 예문(선택)'].concat(rows).join('\n');
}
async function readText(f){
  const b=await f.arrayBuffer();
  try{return new TextDecoder('utf-8',{fatal:true}).decode(b).replace(/^\ufeff/,'')}
  catch(e){return new TextDecoder('euc-kr').decode(b)}
}
const txmsg=x=>{const m=$('#txm');if(m)m.textContent=x};
function openTx(){

async function shareFile(file,say){
  if(DOWNLOADS){
    try{await DOWNLOADS.save({filename:file.name,data:file});say('저장했어요');return}
    catch(e){
      const c=e&&e.code;
      if(c==='declined'){say('저장을 취소했어요');return}
      if(c==='rate_limited'){say('잠시 후 다시 눌러 주세요');return}
    }
  }
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:file.name});return}}catch(e){if(e&&e.name==='AbortError')return}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=file.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);say('파일 저장을 요청했어요. 안 되면 복사를 이용하세요')}
  catch(e){say('파일 저장이 막혀 있어요. 복사를 이용하세요')}
}
function txImport(text){
  const cs=sec();if(!cs)return;
  let add=0,skip=0,bad=0;
  text.replace(/^\ufeff/,'').split(/\r?\n/).forEach(l=>{
    if(!l.trim()||l.trim()[0]==='#')return;
    const v=parseLine(l);
    if(!v||!v.w||!v.m){bad++;return}
    if(cs.words.some(x=>x.w===v.w&&x.m===v.m)){skip++;return}
    cs.words.push({id:uid(),w:v.w,r:v.r,m:v.m,e:v.e,known:false});add++;
  });
  if(add)save();
  const t=$('#txt');if(t)t.value=listText(cs);
  txmsg(add+'개 추가'+(skip?', '+skip+'개는 이미 있어 건너뜀':'')+(bad?', '+bad+'줄은 읽지 못함':''));
  render();
}

const nlang=v=>v.lang.toLowerCase().replace('_','-');

const NOVELTY=['albert','bad news','bahh','bells','boing','bubbles','cellos','deranged','good news','hysterical','jester','bad joke','junior','kathy','fred','ralph','organ','pipe organ','princess','superstar','trinoids','whisper','wobble','zarvox','grandma','grandpa','rocko','shelley','sandy','eddy','flo','reed','bruce','agnes','victoria','boing'];

function voicesByPrefix(pfx,loc){
  try{
    const all=speechSynthesis.getVoices().filter(v=>nlang(v).startsWith(pfx));
    const clean=all.filter(v=>!isNovelty(v));
    const pick=clean.length?clean:all;
    const seen={},use=[];
    pick.forEach(v=>{const k=vuri(v)||v.name+'|'+v.lang;if(seen[k])return;seen[k]=1;use.push(v)});

function voicesOf(tabId){const loc=tabLocale(tabId);return voicesByPrefix((loc.split('-')[0]||'en').toLowerCase(),loc);}

function speakKo(t){try{const u=new SpeechSynthesisUtterance(t);curUtt=u;const v=koVoiceFor();if(v){u.voice=v;u.lang=v.lang}else u.lang='ko-KR';u.rate=TTS.rate;const busy=speechSynthesis.speaking||speechSynthesis.pending;if(speechSynthesis.paused)speechSynthesis.resume();if(busy){speechSynthesis.cancel();setTimeout(()=>speechSynthesis.speak(u),80)}else speechSynthesis.speak(u)}catch(e){}}

function speakP(t,l){
  return new Promise(res=>{

async function playAll(){
  const isFav=view.name==='fav',sid=isFav?null:view.id,curTab=tab,tok={stop:false};player=tok;setPlayUI('');
  const cur=()=>{
    if(isFav){
      const list=[];
      S.sections.filter(x=>x.lang===curTab).forEach(s0=>s0.words.forEach(w=>{if(w.star)list.push(w)}));
      return {words:list,lang:curTab};
    }
    return S.sections.find(x=>x.id===sid)||{words:[],lang:curTab};
  };
  const lang=cur().lang;
  const unk=()=>cur().words.filter(w=>!w.known).map(w=>w.id);
  keepAwake(true).then(ok=>{if(player===tok)pnote(ok?'재생 중에는 화면이 꺼지지 않아요':'화면을 켜 두세요. 꺼지면 재생이 멈춰요')});
  let round=1,ids=unk(),k=0;
  if(!ids.length){player=null;keepAwake(false);setPlayUI('외운 단어를 뺀 재생할 단어가 없어요');pnote('');return}
  const hold=async msg=>{
    tok.paused=true;setPlayUI(msg);
    pnote('단어를 눌러 그 단어부터 재생하거나 ▶ 이어 듣기를 누르세요',true);
    await new Promise(res=>{tok.resume=res});
    tok.resume=null;tok.paused=false;tok.pauseReq=false;
    if(tok.stop)return false;
    setPlayUI('');pnote('');return true;
  };
  while(!tok.stop){
    if(tok.jumpTo){
      const jid=tok.jumpTo;tok.jumpTo=null;
      const i=ids.indexOf(jid);if(i>=0)k=i;
    }
    if(k>=ids.length){
      if(rep!==0&&round>=rep)break;
      round++;ids=unk();k=0;if(!ids.length)break;continue;
    }
    const list=cur().words,w=list.find(x=>x.id===ids[k]);

    const label=(rep===1?'':round+(rep>1?'/'+rep:'')+'회차 · ')+(k+1)+' / '+ids.length;
    setPlayUI('재생 중 '+label);

    if(tok.stop)return;
    if(tok.pauseReq){if(!(await hold('일시정지 · '+label)))return;continue}
    if(tok.jumpTo)continue;
    if(!r.ok&&!soft(r.err)){
      try{speechSynthesis.cancel()}catch(e){}
      await sleep(400);if(tok.stop)return;
      if(tok.pauseReq||tok.jumpTo)continue;
      r=await speakP(w.w,lang);if(tok.stop)return;
      if(tok.pauseReq||tok.jumpTo)continue;
      if(!r.ok&&!soft(r.err)){
        tok.stalled=true;setPlayUI('소리가 나오지 않아 멈췄어요');
        pnote('버튼을 눌러 이어 듣거나 위의 그만 듣기를 누르세요',true);
        await new Promise(res=>{tok.resume=res});
        tok.resume=null;tok.stalled=false;if(tok.stop)return;
        setPlayUI('');pnote('');continue;

    }
    if(TTS.readMeaning&&w.m){
      await wait(tok,1000);
      if(tok.stop)return;
      if(tok.pauseReq){if(!(await hold('일시정지 · '+label)))return;continue}
      if(tok.jumpTo)continue;
      await speakKoP(w.m);

    if(tok.pauseReq){if(!(await hold('일시정지 · '+label)))return;continue}
    if(tok.jumpTo)continue;
    k++;
  }

  <div class="rp"><span>반복</span>${[[1,'1번'],[3,'3번'],[0,'무한']].map(x=>`<button class="pill${rep===x[0]?' on':''}" data-act="rep" data-n="${x[0]}">${x[1]}</button>`).join('')}</div>
  <div id="pl" class="pl" aria-live="polite"></div>
  <div id="pn" class="pl"></div>`:'';
  return `<button class="link" data-act="home">← ${tabName(lang)} 섹션</button>
  <div class="sh"${favTint}><h1>⭐ 즐겨찾기</h1><button class="ic" data-act="favcolor" aria-label="즐겨찾기 색상 변경">⋯</button></div>${body}
  <ul class="list">${rows||'<li class="empty">즐겨찾기한 단어가 없어요.<br>단어의 ☆를 눌러 추가해보세요.</li>'}</ul>`;
}

function studyView(){
  const d=study,s=sec();
  if(d.i>=d.deck.length){
    const miss=s.words.filter(w=>!w.known).length;
    return `<div class="res"><span class="big">${d.ok}개 알고 있어요</span><p class="sub">${d.deck.length}개 중 ${d.no}개는 다시 볼 단어예요.</p>
    <div class="act"><button class="btn" data-act="study" data-only="1" ${miss?'':'disabled'}>못 외운 단어만 다시</button><button class="btn ghost" data-act="study" data-only="0">전체 다시 보기</button></div>
    <p><button class="link" data-act="back">← ${esc(s.name)}로 돌아가기</button></p></div>`;
  }
  const w=d.deck[d.i];
  const card=d.flip
    ?`<button class="deck back" data-act="flip"><span class="big">${esc(w.m)}</span><span class="hint">${esc(w.w)}${w.r?' ('+esc(w.r)+')':''}${w.e?' · '+esc(w.e):''}</span></button>`
    :`<button class="deck" data-act="flip"><span class="big">${esc(w.w)}</span><span class="hint">눌러서 뜻 보기</span></button>`;
  const aud=tabAudio(s.lang);
  return `<div class="top"><button class="link" data-act="back">← 그만하기</button><span>${aud?'<button class="link" data-act="speak">🔊 듣기</button> ':''}${d.i+1} / ${d.deck.length}</span></div>${card}

function render(){
  const cur=view.name==='home'?'':(view.id||'');
  if(cur!==lastId){lastId=cur;try{localStorage.setItem('vocab-last',cur)}catch(e){}save()}
  try{document.title=getTitle()}catch(e){}
  $('#app').innerHTML=view.name==='home'?home():view.name==='sec'?secView():view.name==='fav'?favView():view.name==='search'?searchView():studyView();
}
function heartBurst(el){
  try{
    if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
    const r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
    for(let i=0;i<6;i++){
      const h=document.createElement('span');
      h.className='heart';h.textContent='💗';
      h.style.left=cx+'px';h.style.top=cy+'px';
      h.style.setProperty('--hx',Math.round((Math.random()-.5)*70)+'px');
      h.style.setProperty('--hr',Math.round((Math.random()-.5)*40)+'deg');
      h.style.animationDelay=Math.round(Math.random()*120)+'ms';
      document.body.appendChild(h);
      h.addEventListener('animationend',()=>h.remove());
      setTimeout(()=>{if(h.isConnected)h.remove()},1500);
    }
  }catch(e){}
}
function searchResultsHTML(){
  const q=(view.q||'').trim().toLowerCase();
  const results=[];
  if(q){
    S.sections.forEach(sec0=>{
      sec0.words.forEach(w=>{
        if(w.w.toLowerCase().includes(q)||w.m.toLowerCase().includes(q)||(w.r||'').toLowerCase().includes(q))results.push({w,sec0});
      });
    });
  }
  const showN=view.showN||PAGE_N;
  const shown=results.slice(0,showN);
  const row=({w,sec0})=>{
    const aud=tabAudio(sec0.lang);
    return `<li class="w"><div class="wr" data-act="srchopen" data-id="${w.id}" data-sec="${sec0.id}"><div class="wtop"><div class="wt"><b>${esc(w.w)}</b>${w.r?`<span class="rd">${esc(w.r)}</span>`:''}</div><div class="wicons"><button class="ic star${w.star?' on':''}" data-act="star" data-id="${w.id}" data-sec="${sec0.id}" aria-label="${w.star?'즐겨찾기 해제':'즐겨찾기 추가'}" aria-pressed="${!!w.star}">${w.star?'★':'☆'}</button>${aud?`<button class="ic" data-act="speak" data-id="${w.id}" data-sec="${sec0.id}" aria-label="발음 듣기">🔊</button>`:''}</div></div><div class="wm">${esc(w.m)}</div><div class="srchpath">${esc(tabName(sec0.lang))} · ${esc(sec0.name)}</div></div></li>`;
  };
  const rows=shown.map(row).join('');
  const moreBtn=results.length>shown.length?`<button class="wmore" data-act="showmore">더 보기 (${results.length-shown.length}개 더)</button>`:'';
  const empty=!q?'단어나 뜻을 입력해서 전체 단어장을 검색해요.':(results.length?'':'검색 결과가 없어요.');
  return `<ul class="list">${rows||`<li class="empty">${empty}</li>`}</ul>${moreBtn}`;
}
function searchView(){
  return `<button class="link" data-act="home">← 홈으로</button>
  <div class="sh"><h1>🔍 단어 검색</h1></div>
  <input id="gsearch" class="wsearch" type="search" placeholder="모든 섹션에서 단어·뜻 검색" value="${esc(view.q||'')}" aria-label="전체 단어 검색">
  <div id="searchResults">${searchResultsHTML()}</div>`;
}

  else if(a==='secup'||a==='secdown'){
    const list=S.sections.filter(x=>x.lang===tab);
    const i=list.findIndex(x=>x.id===secId),j=a==='secup'?i-1:i+1;
    if(i<0||j<0||j>=list.length)return;

      return;

    $('#dlg').innerHTML=`<div class="ov"><div class="dl" role="alertdialog" aria-modal="true"><p class="dm">중복 단어 ${dupIds.length}개를 지울까요?</p><p class="ds">단어와 뜻이 모두 같은 항목 중 먼저 추가된 것만 남겨요.</p><div class="dr"><button class="btn ghost" id="dlno" data-act="dlgno">취소</button><button class="btn warn" data-act="dedupeok">지우기</button></div></div></div>`;
    return;

    save();render();
    return;

  else if(a==='moveask'){openMovePick();return;}
  else if(a==='copyask'){openMovePick();return;}
  else if(a==='delselect'){

    if(!ids.length)return;

    return;
  }
  else if(a==='moveto'){doMove(id);return;}
  else if(a==='copyto'){doCopy(id);return;}
  else if(a==='newsec'){view.adding=true;}
  else if(a==='cancelnew'){view.adding=false;}
  else if(a==='pane'){
    const one=b.dataset.p==='one';
    document.querySelectorAll('#sheet [data-pane]').forEach(f=>{f.hidden=(f.dataset.pane==='one')!==one});
    document.querySelectorAll('#sheet .seg button').forEach(x=>x.classList.toggle('on',x===b));
    return;
  }
  else if(a==='vprev'){
    const l=b.dataset.l,p=tabInfo(l).pron;
    const g=p==='roman'?'こんにちは、お元気ですか？':p==='pinyin'?'你好，你好吗？':p==='ipa'?'Hello, how are you?':tabName(l);
    speak(g,l);return;
  }

  else if(a==='tabsopen'){closeDlg();view.addtab=false;view.edittab=null;openTabs();return;}

    if(dlg&&dlg.k==='tabs'){view.addtab=true;openTabs();}
    else{closeDlg();view.addtab=true;openTabs();}
    return;
  }
  else if(a==='canceltab'){view.addtab=false;openTabs();return;}
  else if(a==='tabedit'){view.edittab=id;view.addtab=false;openTabs();return;}
  else if(a==='canceltabedit'){view.edittab=null;openTabs();return;}
  else if(a==='tabup'||a==='tabdown'){
    const i=S.tabs.findIndex(x=>x.id===id),j=a==='tabup'?i-1:i+1;
    if(i<0||j<0||j>=S.tabs.length)return;
    const arr=S.tabs.slice();[arr[i],arr[j]]=[arr[j],arr[i]];S.tabs=arr;save();render();openTabs();

  }
  else if(a==='tabaudio'){
    S.tabs=S.tabs.map(x=>x.id===id?Object.assign({},x,{audio:x.audio===false}):x);

  }
  else if(a==='bk'){openBk();return;}

      stopPlay();S.sections=JSON.parse(JSON.stringify(d.data.sections));
      if(Array.isArray(d.data.tabs)&&d.data.tabs.length&&d.data.tabs.every(x=>x&&typeof x.id==='string'&&typeof x.name==='string'))S.tabs=JSON.parse(JSON.stringify(d.data.tabs));
      else ensureTabs();

    else{view.showN=Infinity;player={pending:true};render();playAll()}
    return;
  }
  else if(a==='showmore'){view.showN=(view.showN||PAGE_N)+PAGE_N;render();return;}
  else if(a==='wfilter'){view.filter=b.dataset.f;view.showN=PAGE_N;render();return;}
  else if(a==='playstop'){stopPlay();return;}
  else if(a==='rep'){rep=Number(b.dataset.n);try{localStorage.setItem('vocab-rep',String(rep))}catch(e){}save();}

  else if(a==='known'){const w=s.words.find(x=>x.id===id);w.known=!w.known;save();}
  else if(a==='star'){const w=s&&s.words.find(x=>x.id===id);if(w){w.star=!w.star;saveNow();}}
  else if(a==='delw'){const w=s.words.find(x=>x.id===id);if(w)askDel({k:'w',id},'‘'+esc(w.w)+'’ 단어를 삭제할까요?','삭제하면 되돌릴 수 없어요.');return;}
  else if(a==='study'){
    const only=b.dataset.only!=='0';
    const pool=only?s.words.filter(w=>!w.known):s.words;
    if(!pool.length)return;
    study={deck:shuffle(pool),i:0,flip:false,ok:0,no:0};
    view={name:'study',id:view.id};
  }
  else if(a==='flip'){study.flip=!study.flip;}
  else if(a==='mark'){
    const cw=study.deck[study.i],w=(s&&s.words.find(x=>x.id===cw.id))||cw,v=b.dataset.v==='1';
    w.known=v;v?study.ok++:study.no++;save();
    study.i++;study.flip=false;
  }
  render();
  if(a==='newsec'){const i=$('form[data-form=addsec] input');if(i)i.focus()}
});

    const t=e.target;
    wsTimer=setTimeout(()=>{
      view.q=t.value;view.showN=PAGE_N;
      const box=document.getElementById('listArea');
      if(box&&view.name==='sec')box.innerHTML=buildWordList(sec());
    },150);
    return;
  }
  if(e.target.id==='gsearch'){
    clearTimeout(wsTimer);
    const t=e.target;
    wsTimer=setTimeout(()=>{
      view.q=t.value;view.showN=PAGE_N;
      const box=document.getElementById('searchResults');
      if(box&&view.name==='search')box.innerHTML=searchResultsHTML();
    },150);
    return;
  }
  if(e.target.dataset&&e.target.dataset.auto)delete e.target.dataset.auto;const f0=e.target.closest&&e.target.closest('form');if(f0&&f0.dataset.dupok)delete f0.dataset.dupok;});

document.addEventListener('submit',async e=>{
  const f=e.target.closest('[data-form]');if(!f)return;
  e.preventDefault();
  const t=f.dataset.form,d=new FormData(f),s=view.id?sec():null;
  if(t==='addsec'){
    const n=d.get('n').trim();if(!n)return;
    const ns={id:uid(),name:n,lang:tab,words:[]};S.sections.push(ns);save();view={name:'sec',id:ns.id};
  }
  else if(t==='editw'){
    const v={w:d.get('w').trim(),r:(d.get('r')||'').trim(),m:d.get('m').trim(),e:(d.get('e')||'').trim(),h:(d.get('h')||'').trim()};
    const cs=sec(),w=cs&&cs.words.find(x=>x.id===f.dataset.id);
    if(!w)return;
    w.w=v.w;w.r=v.r;w.m=v.m;w.e=v.e;w.h=v.h;save();
    closeSheet();
  }
  else if(t==='addtab'){
    const n=(d.get('n')||'').trim();if(!n)return;
    const pron=d.get('pron')||'free';
    const locOverride=d.get('loc')||'';
    const locale=locOverride||(pron==='ipa'?'en-US':pron==='pinyin'?'zh-CN':pron==='roman'?'ja-JP':guessLocale(n));
    const audio=!!d.get('audio');
    const nt={id:uid(),name:withFlag(n,locale),pron,locale,locOverride,audio};
    S.tabs=S.tabs.concat([nt]);tab=nt.id;
    try{localStorage.setItem('vocab-tab',tab)}catch(x){}
    view.addtab=false;save();render();openTabs();
    requestAnimationFrame(()=>{const el=document.querySelector('.tab.on');if(el)el.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'})});
  }
  else if(t==='edittab'){
    const eid=f.dataset.id,n=(d.get('n')||'').trim();if(!n)return;
    const pron=d.get('pron')||'free';
    const audio=!!d.get('audio');
    const locOverride=d.get('loc')||'';
    S.tabs=S.tabs.map(x=>{
      if(x.id!==eid)return x;
      const locale=locOverride||(pron==='ipa'?'en-US':pron==='pinyin'?'zh-CN':pron==='roman'?'ja-JP':guessLocale(n));
      return Object.assign({},x,{name:withFlag(n,locale),pron,audio,locale,locOverride});
    });
    view.edittab=null;save();render();openTabs();
  }
  else if(t==='rename'){s.name=d.get('n').trim()||s.name;view.renaming=false;save();}
  else if(t==='renametitle'){S.title=(d.get('n')||'').trim()||'나만의 단어장';view.titleEdit=false;save();}
  else if(t==='addw'){
    const more=!!(e.submitter&&e.submitter.value==='more');
    const v={w:d.get('w').trim(),r:(d.get('r')||'').trim(),m:d.get('m').trim(),e:(d.get('e')||'').trim(),h:(d.get('h')||'').trim()};
    const cs=sec();if(!cs)return;
    const sig=v.w+'\u241F'+v.m;
    if(cs.words.some(x=>x.w===v.w&&x.m===v.m)&&f.dataset.dupok!==sig){
      f.dataset.dupok=sig;
      const a=f.querySelector('.afm');if(a)a.textContent='이미 있는 단어예요. 다시 누르면 그래도 추가돼요';
      return;
    }
    delete f.dataset.dupok;
    cs.words.push({id:uid(),w:v.w,m:v.m,e:v.e,r:v.r,h:v.h,known:false});save();
    if(more){
      f.reset();f.querySelectorAll('[data-auto]').forEach(x=>delete x.dataset.auto);
      const a=f.querySelector('.afm');if(a)a.textContent='추가했어요. 다음 단어를 입력하세요';
      if(f.elements.w)f.elements.w.focus();
    }else closeSheet();
  }
  else if(t==='bulk'){
    let add=0,skip=0;
    d.get('t').split('\n').forEach(l=>{
      l=l.trim();if(!l)return;
      let w=null;
      {const p=l.split(/\t|\s*[,，、]\s*/);if(p.length>=3&&/[a-zA-Z]/.test(p[1]))w={w:p[0].trim(),r:p[1].trim(),m:p.slice(2).join(', ').trim(),e:''};}
      if(!w){const mm=l.match(/^(.+?)(?:\t|\s[-–]\s|\s*[,=]\s*)(.+)$/);if(mm)w={w:mm[1].trim(),r:'',m:mm[2].trim(),e:''};}
      if(!w)w={w:l,r:'',m:'',e:''};
      if(!w.w)return;
      if(s.words.some(x=>x.w===w.w&&x.m===w.m)){skip++;return}
      s.words.push({id:uid(),w:w.w,r:w.r,m:w.m,e:w.e,known:false});add++;
    });
    save();closeSheet();
    stat(add+'개 추가'+(skip?', '+skip+'개는 이미 있어 건너뜀':''));
  }
  render();
});
lastId=targetId(lastId);
if(lastId){view={name:'sec',id:lastId};tab=(sec().lang||'en')}
try{
  const toTop=$('#totop');
  if(toTop){
    window.addEventListener('scroll',()=>{toTop.classList.toggle('show',window.scrollY>400)},{passive:true});
    toTop.addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));
  }
}catch(e){}
try{
  const PTR_TRIGGER=64,PTR_MAX=100;
  let ptrEl=null,startY=0,pulling=false,ready=false;
  const atTop=()=>(document.scrollingElement||document.documentElement).scrollTop<=0;
  const ensurePtr=()=>{
    if(!ptrEl){ptrEl=document.createElement('div');ptrEl.className='ptr';ptrEl.innerHTML='<span class="ptrarrow">↓</span>';document.body.appendChild(ptrEl)}
    return ptrEl;
  };
  window.addEventListener('touchstart',e=>{
    if(dlg||sheet||e.touches.length!==1||!atTop())return;
    startY=e.touches[0].clientY;pulling=true;ready=false;
  },{passive:true});
  window.addEventListener('touchmove',e=>{
    if(!pulling)return;
    if(!atTop()){pulling=false;if(ptrEl)ptrEl.classList.remove('pulling');return}
    const dy=e.touches[0].clientY-startY;
    if(dy<=0)return;
    e.preventDefault();
    const pull=Math.min(dy*.5,PTR_MAX);
    ready=pull>=PTR_TRIGGER;
    const el=ensurePtr();
    el.classList.add('pulling');
    el.classList.toggle('ready',ready);
    el.style.transform=`translate(-50%, ${pull-60}px)`;
  },{passive:false});
  const endPull=()=>{
    if(!pulling)return;
    pulling=false;
    if(!ptrEl)return;
    ptrEl.classList.remove('pulling');
    if(ready){
      ptrEl.classList.add('spin');
      ptrEl.style.transform='translate(-50%, 26px)';
      setTimeout(()=>location.reload(),200);
    }else{
      ptrEl.classList.remove('ready');
      ptrEl.style.transform='translate(-50%, -60px)';
    }
  };
  window.addEventListener('touchend',endPull,{passive:true});
  window.addEventListener('touchcancel',endPull,{passive:true});
}catch(e){}
startLast=lastId;
render();
</script>
